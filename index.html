<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshmallow Order Form</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary: #ffb6c1;
            --primary-dark: #ff91a4;
            --text: #4a4a4a;
            --bg: #fff5f6;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: var(--primary-dark);
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        select,
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .sub-question {
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-question input {
            width: 80px;
        }

        .total-display {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin: 10px 0 20px 0;
            color: #2c3e50;
        }

        .receipt-display {
            font-size: 14px;
            color: #7f8c8d;
            text-align: right;
            margin-top: 20px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        iframe {
            display: none;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Marshmallow Order Form</h2>

        <form id="orderForm" method="POST">
            <input type="hidden" id="totalPriceInput" name="totalPrice" value="$0.00">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="contactInfo">Email or Phone Number</label>
                <input type="text" id="contactInfo" name="contactInfo" required placeholder="name@example.com or 555-1234">
            </div>

            <div class="form-group">
                <label for="flavour">Marshmallow Flavour</label>
                <select id="flavour" name="flavour" required>
                    <option value="" disabled selected>Loading flavours from spreadsheet...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="totalQty">Total Quantity</label>
                <input type="number" id="totalQty" name="totalQty" min="0" value="0">

                <!-- Hidden fields for backwards compatibility with the spreadsheet columns -->
                <input type="hidden" id="sq1" name="multipack20" value="0">
                <input type="hidden" id="sq2" name="multipack3" value="0">
                <input type="hidden" id="sq3" name="multipack1" value="0">
                <input type="hidden" id="sq4" name="otherQty" value="0">
            </div>

            <div class="receipt-display" id="receiptDisplay"></div>
            <div class="total-display" id="totalPriceDisplay">Total: $0.00</div>
            <button type="submit" id="submitBtn">Submit Order</button>
        </form>
    </div>

    <script>
        const SPREADSHEET_ID = "18RfL1f5ec2k0mK2Y0ktk_in-BV6XFYFCrxpjQg4j7Q8";
        const POST_URL = "https://script.google.com/macros/s/AKfycbwyRxfQp4tPB8hFgezv7AjbcySJyckmqinTLwhTwcE2tYRufLTvewj-5YvQ32_9ZSAqhw/exec";

        const form = document.getElementById('orderForm');
        const flavourSelect = document.getElementById('flavour');
        let firstFlavourValue = "";

        form.action = POST_URL;

        // Pull rows securely via public data serialization script injections
        function loadFlavours() {
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:googleResponseWrapper&sheet=FLAVOUR+INFO&range=A2:D`;
            script.onerror = function () {
                console.error("Failed to build connection pipeline to Google infrastructure.");
                flavourSelect.innerHTML = '<option value="" disabled>Connection Error</option>';
            };
            document.body.appendChild(script);
        }

        // JSONP receiver loop target
        window.googleResponseWrapper = function (data) {
            const dynamicFlavors = [];

            if (data && data.table && data.table.rows) {
                data.table.rows.forEach(row => {
                    if (row.c && row.c[0] && row.c[0].v !== null) {
                        const name = String(row.c[0].v).trim();
                        const p20 = row.c[1] ? Number(row.c[1].v) : 0;
                        const p3 = row.c[2] ? Number(row.c[2].v) : 0;
                        const p1 = row.c[3] ? Number(row.c[3].v) : 0;
                        dynamicFlavors.push({ name, p20, p3, p1 });
                    }
                });
            }

            renderDropdown(dynamicFlavors);
        };

        function renderDropdown(flavors) {
            if (flavors && flavors.length > 0) {
                flavourSelect.innerHTML = '<option value="" disabled selected>Select a flavour...</option>';

                flavors.forEach(flavor => {
                    if (flavor.name) {
                        const opt = document.createElement('option');
                        opt.value = flavor.name;
                        opt.textContent = flavor.name;
                        opt.dataset.p20 = flavor.p20;
                        opt.dataset.p3 = flavor.p3;
                        opt.dataset.p1 = flavor.p1;
                        flavourSelect.appendChild(opt);
                    }
                });
            } else {
                flavourSelect.innerHTML = '<option value="" disabled>No flavours found in sheet</option>';
            }
        }

        function calculatePrice() {
            let price = 0;

            const totalQty = parseInt(document.getElementById('totalQty').value) || 0;

            const qty20 = Math.floor(totalQty / 20);
            const rem20 = totalQty % 20;
            const qty3 = Math.floor(rem20 / 3);
            const rem3 = rem20 % 3;
            const qty1 = rem3;

            document.getElementById('sq1').value = qty20;
            document.getElementById('sq2').value = qty3;
            document.getElementById('sq3').value = qty1;
            document.getElementById('sq4').value = 0;

            let p20 = 25, p3 = 4.5, p1 = 2; // Default fallback
            const selectedOpt = flavourSelect.options[flavourSelect.selectedIndex];
            if (selectedOpt && selectedOpt.dataset.p20) {
                p20 = parseFloat(selectedOpt.dataset.p20) || 0;
                p3 = parseFloat(selectedOpt.dataset.p3) || 0;
                p1 = parseFloat(selectedOpt.dataset.p1) || 0;
            }

            price += qty20 * p20;
            price += qty3 * p3;
            price += qty1 * p1;

            const formatted = `$${price.toFixed(2)}`;

            let receiptHtml = "";
            if (totalQty > 0) {
                if (qty20 > 0) receiptHtml += `${qty20}x Mpk 20: $${(qty20 * p20).toFixed(2)}<br>`;
                if (qty3 > 0) receiptHtml += `${qty3}x Mpk 3: $${(qty3 * p3).toFixed(2)}<br>`;
                if (qty1 > 0) receiptHtml += `${qty1}x Mpk 1: $${(qty1 * p1).toFixed(2)}<br>`;
            }

            document.getElementById('receiptDisplay').innerHTML = receiptHtml;
            document.getElementById('totalPriceDisplay').textContent = `Total: ${formatted}`;
            document.getElementById('totalPriceInput').value = formatted;
            return price;
        }

        form.addEventListener('input', calculatePrice);
        window.addEventListener('DOMContentLoaded', loadFlavours);

        let submissionActive = false;
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent standard form submission
            if (submissionActive) return;

            // Update calculation one last time to ensure hidden fields are perfect
            calculatePrice();

            submissionActive = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = "Sending...";

            const formData = new FormData(form);

            fetch(POST_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            })
                .then(() => {
                    alert("Order saved to Google Sheets successfully!");
                    form.reset();
                    calculatePrice();
                })
                .catch((error) => {
                    console.error('Error submitting form:', error);
                    alert("There was an error saving your order. Please try again.");
                })
                .finally(() => {
                    submissionActive = false;
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = "Submit Order";
                });
        });
    </script>
</body>

</html>
