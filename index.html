<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshmallow Order Form</title>
    <style>
        :root { --primary: #ffb6c1; --primary-dark: #ff91a4; --text: #4a4a4a; --bg: #fff5f6; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h2 { color: var(--primary-dark); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], select, input[type="number"] { width: 100%; padding: 10px; border: 2px solid #f0f0f0; border-radius: 8px; box-sizing: border-box; }
        .sub-question { background: #fafafa; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .sub-question input { width: 80px; }
        .total-display { font-size: 20px; font-weight: bold; text-align: right; margin: 20px 0; color: #2c3e50; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: var(--primary-dark); }
        iframe { display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Marshmallow Order Form</h2>
    
    <!-- target redirects action data to the hidden iframe below, bypassing CORS completely -->
    <form id="orderForm" method="POST" target="hidden_iframe">
        <input type="hidden" id="totalPriceInput" name="totalPrice" value="$0.00">
        
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="flavour">Marshmallow Flavour</label>
            <select id="flavour" name="flavour" required>
                <option value="" disabled selected>Loading flavours...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <div class="sub-question"><label for="sq1">Multipack: 20pcs</label><input type="number" id="sq1" name="multipack20" min="0" max="2" value="0"></div>
            <div class="sub-question"><label for="sq2">Multipack: 3pcs</label><input type="number" id="sq2" name="multipack3" min="0" max="6" value="0"></div>
            <div class="sub-question"><label for="sq3">Multipack: 1pcs</label><input type="number" id="sq3" name="multipack1" min="0" max="1" value="0"></div>
            <div class="sub-question"><label for="sq4">Other Quantity</label><input type="number" id="sq4" name="otherQty" min="0" max="100" value="0"></div>
        </div>

        <div class="total-display" id="totalPriceDisplay">Total: $0.00</div>
        <button type="submit" id="submitBtn">Submit Order</button>
    </form>
</div>

<!-- Hidden processing window target -->
<iframe name="hidden_iframe" id="hidden_iframe"></iframe>

<script>
    // 1. PASTE YOUR NEW UPDATED EXEC URL HERE (The one ending in /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbzdbZAJdf1_E97B-TKxZ6HTlt5HQJ8tg00zfD37O880X5yWWll7pbOND6WeKvCRa4VAHA/exec";

    const form = document.getElementById('orderForm');
    const flavourSelect = document.getElementById('flavour');
    let firstFlavourValue = ""; 

    form.action = API_URL;

    // 2. Load flavors seamlessly via JSONP script injection
    function loadFlavours() {
        const script = document.createElement('script');
        script.src = `${API_URL}?callback=onFlavorsLoaded`;
        script.onerror = function() {
            console.warn("Script loading failed. Using fallback catalog list.");
            onFlavorsLoaded({ flavors: ["Classic Vanilla", "Toasted Coconut", "Strawberry Swirl"] });
        };
        document.body.appendChild(script);
    }

    // 3. Callback parsing configuration
    window.onFlavorsLoaded = function(data) {
        flavourSelect.innerHTML = '<option value="" disabled selected>Select a flavour...</option>';
        if (data && data.flavors && data.flavors.length > 0) {
            // Sets dynamic baseline targeting cell A2 for conditional pricing mechanics
            firstFlavourValue = data.flavors[0]; 
            
            data.flavors.forEach(flavor => {
                const opt = document.createElement('option');
                opt.value = flavor;
                opt.textContent = flavor;
                flavourSelect.appendChild(opt);
            });
        } else {
            flavourSelect.innerHTML = '<option value="" disabled>No flavours found</option>';
        }
    };

    function calculatePrice() {
        const isA2 = flavourSelect.value === firstFlavourValue;
        let price = 0;

        price += (parseInt(document.getElementById('sq1').value) || 0) * (isA2 ? 20 : 25);
        price += (parseInt(document.getElementById('sq2').value) || 0) * (isA2 ? 3.5 : 4.5);
        price += (parseInt(document.getElementById('sq3').value) || 0) * (isA2 ? 1.5 : 2);
        price += (parseInt(document.getElementById('sq4').value) || 0) * (isA2 ? 1.5 : 2);

        const formatted = `$${price.toFixed(2)}`;
        document.getElementById('totalPriceDisplay').textContent = `Total: ${formatted}`;
        document.getElementById('totalPriceInput').value = formatted;
        return price;
    }

    form.addEventListener('input', calculatePrice);
    window.addEventListener('DOMContentLoaded', loadFlavours);

    let submissionActive = false;
    form.addEventListener('submit', () => {
        submissionActive = true;
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = "Sending...";
    });

    document.getElementById('hidden_iframe').addEventListener('load', () => {
        if (submissionActive) {
            alert("Order saved to Google Sheets successfully!");
            form.reset();
            calculatePrice();
            submissionActive = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = "Submit Order";
        }
    });
</script>

</body>
</html>
